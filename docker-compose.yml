services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jev_local_password}
      POSTGRES_DB: jev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
